%YAML 1.2
---
# metadata provides information about the schema
metadata:
  id: "tulatyper_targets"
  name: "F. tularensis subspecies (targets)"              
  description: "A schema for F. tularensis subtyping using specific targets" 
  version: "0.2"                              
  curators:                                      
    - "Erin Young"
    - "Megan Phillips"
    - "Vishnu Raghuram"
    - "David Mahoney"
    - "Robert Petit"

# engine provides information about the tool and parameters used
engine:
  type: "blast" # The type of engine to use
  tool: tblastn # The tool used to generate the data
  params:
    min_pident: 99    # The minimum percent identity for a hit
    min_coverage: 99  # The minimum coverage for a hit

# targets provides a list of sequence targets (primers, genes, proteins, etc...)
targets:
 - "ahbD"
 - "alr"
 - "bcp"
 - "chlI"
 - "cysD"
 - "emrA"
 - "group_1181"
 - "group_1182"
 - "group_15"
 - "group_171"
 - "group_181"
 - "group_191"
 - "group_20"
 - "group_22"
 - "group_245"
 - "group_248"
 - "group_25"
 - "group_251"
 - "group_255"
 - "group_27"
 - "group_3"
 - "group_316"
 - "group_351"
 - "group_361"
 - "group_415"
 - "group_427"
 - "group_449"
 - "group_452"
 - "group_474"
 - "group_475"
 - "group_479"
 - "group_583"
 - "group_595"
 - "group_660"
 - "group_664"
 - "group_755"
 - "group_808"
 - "group_832"
 - "group_834"
 - "group_85"
 - "group_899"
 - "group_935"
 - "group_956"
 - "group_959"
 - "group_964"
 - "group_966"
 - "group_968"
 - "merT"
 - "rpoA1"

# aliases allow for grouping of targets under a common name
aliases:
  - name: "alias_4" 
    targets: ["group_3","group_191"] 
  - name: "alias_1678"
    targets: ["ahbD", "alr","group_15", "cysD"]
  - name: "alias_3"
    targets: ["chlI","group_664"]
  - name : "alias_5"
    targets: ["group_427"]    
  - name: "alias_2"
    targets: ["group_660"]

# types includes the final typing designations based on targets and aliases 
types:
  - name: "holarctica"          # name of the types
    targets:           # list of targets that are part of the types
      - "alias_4"
      - "rpoA1"

    excludes:
      - "alias_1678"
      - "alias_3"
      - "alias_2"
      - "alias_5"
      
  - name: "novicida"
    targets:
      - "alias_1678"
      - "rpoA1"

    excludes:
      - "alias_4"
      - "alias_3"
      - "alias_2"
      - "alias_5"
      
  - name: "tularensis_1"
    targets:
      - "alias_3"
      - "rpoA1"

    excludes:          # list of targets that if present will exclude the type
      - "alias_4"
      - "alias_1678"
      - "alias_2"
      - "alias_5"
      
  - name: "mediasiatica"
    targets:
      - "alias_2"
      - "rpoA1"

    excludes:          # list of targets that if present will exclude the type
      - "alias_4"
      - "alias_3"
      - "alias_1678"
      - "alias_5"
      
  - name: "tularensis_2"
    targets:
      - "alias_5"
      - "rpoA1"

    excludes:          # list of targets that if present will exclude the type
      - "alias_4"
      - "alias_3"
      - "alias_2"
      - "alias_1678"
